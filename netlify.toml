[build]
  base = "portfolio-nextjs"
  command = "npx prisma generate && npm run build"
  publish = ".next"

[functions]
  directory = ".netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Configuración para Next.js API Routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
